<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:260px;height:260px;}
  .pad-btn{border-radius:14px;border:3px solid #05060d;cursor:pointer;opacity:.55;transition:opacity .1s;}
  .pad-btn.lit{opacity:1;box-shadow:0 0 30px currentColor;}
  #p0{background:#ff2e88;} #p1{background:#37f0ff;} #p2{background:#ffd23f;} #p3{background:#38ffab;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🎵 Simon Says</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Round <b id="round">0</b></div><div class="stat">Best <b id="best">0</b></div></div>
  <div id="pad">
    <div class="pad-btn" id="p0" data-i="0"></div>
    <div class="pad-btn" id="p1" data-i="1"></div>
    <div class="pad-btn" id="p2" data-i="2"></div>
    <div class="pad-btn" id="p3" data-i="3"></div>
  </div>
  <div class="overlay-msg" id="msg">Tap Start</div>
  <button class="mini-btn" id="startBtn">Start</button>
</div>

<script>
const pads = [0,1,2,3].map(i=>document.getElementById('p'+i));
const roundEl=document.getElementById('round'), bestEl=document.getElementById('best'), msg=document.getElementById('msg');
let best=parseInt(localStorage.getItem('chg_simon_best')||'0'); bestEl.textContent=best;
let seq=[], userIdx=0, accepting=false;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx;
function beep(freq){
  if(!actx) actx = new AudioCtx();
  const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.value=freq; o.type='square';
  g.gain.value=0.05;
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+0.15);
}
const FREQS=[220,277,330,392];

function lit(i,on){ pads[i].classList.toggle('lit', on); }
async function playSeq(){
  accepting=false; msg.textContent='Watch...';
  for(let i=0;i<seq.length;i++){
    await new Promise(r=>setTimeout(r,350));
    lit(seq[i],true); beep(FREQS[seq[i]]);
    await new Promise(r=>setTimeout(r,300));
    lit(seq[i],false);
  }
  userIdx=0; accepting=true; msg.textContent='Your turn';
}
function nextRound(){
  seq.push(Math.floor(Math.random()*4));
  roundEl.textContent = seq.length;
  playSeq();
}
pads.forEach(p=>p.addEventListener('click', ()=>{
  if(!accepting) return;
  const i = parseInt(p.dataset.i);
  lit(i,true); beep(FREQS[i]); setTimeout(()=>lit(i,false),200);
  if(i===seq[userIdx]){
    userIdx++;
    if(userIdx===seq.length){ accepting=false; setTimeout(nextRound,600); }
  } else {
    accepting=false;
    if(seq.length-1>best){ best=seq.length-1; localStorage.setItem('chg_simon_best',best); bestEl.textContent=best; }
    msg.textContent='Wrong! Reached round '+seq.length+'. Tap Start to retry.';
    seq=[]; roundEl.textContent=0;
  }
}));
document.getElementById('startBtn').addEventListener('click', ()=>{
  seq=[]; roundEl.textContent=0; nextRound();
});
</script>
</body></html>
