<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🏓 Pong</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud">
    <div class="stat">P1 <b id="s1">0</b></div>
    <div class="stat">P2 / CPU <b id="s2">0</b></div>
    <button class="mini-btn" id="modeBtn" style="margin:0;">Mode: vs CPU</button>
  </div>
  <canvas id="c" width="480" height="320"></canvas>
  <div class="controls-hint">P1: W / S &nbsp;·&nbsp; P2: ↑ / ↓ (only used in 2-player mode) &nbsp;·&nbsp; First to 7 wins.</div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let p1={y:H/2-30,h:60,score:0}, p2={y:H/2-30,h:60,score:0};
let ball={x:W/2,y:H/2,vx:4,vy:3,r:6};
let keys={}; let vsCPU=true;
document.getElementById('modeBtn').addEventListener('click', ()=>{
  vsCPU=!vsCPU;
  document.getElementById('modeBtn').textContent = 'Mode: ' + (vsCPU?'vs CPU':'2 Player');
});
document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

function resetBall(dir){
  ball={x:W/2,y:H/2,vx:4*dir,vy:(Math.random()*4-2)};
}
function step(){
  if(keys['w']) p1.y-=5; if(keys['s']) p1.y+=5;
  p1.y=Math.max(0,Math.min(H-p1.h,p1.y));
  if(vsCPU){
    const target = ball.y - p2.h/2;
    p2.y += Math.sign(target-p2.y) * Math.min(4, Math.abs(target-p2.y));
  } else {
    if(keys['arrowup']) p2.y-=5; if(keys['arrowdown']) p2.y+=5;
  }
  p2.y=Math.max(0,Math.min(H-p2.h,p2.y));

  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.y<ball.r || ball.y>H-ball.r) ball.vy*=-1;

  if(ball.x-ball.r<20 && ball.y>p1.y && ball.y<p1.y+p1.h){ ball.vx=Math.abs(ball.vx)*1.03; ball.vy+=(Math.random()*2-1); }
  if(ball.x+ball.r>W-20 && ball.y>p2.y && ball.y<p2.y+p2.h){ ball.vx=-Math.abs(ball.vx)*1.03; ball.vy+=(Math.random()*2-1); }

  if(ball.x<0){ p2.score++; updateScore(); resetBall(1); }
  if(ball.x>W){ p1.score++; updateScore(); resetBall(-1); }

  draw();
  requestAnimationFrame(step);
}
function updateScore(){
  document.getElementById('s1').textContent=p1.score;
  document.getElementById('s2').textContent=p2.score;
}
function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2a2f57'; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#37f0ff'; ctx.fillRect(12,p1.y,8,p1.h);
  ctx.fillStyle='#ff2e88'; ctx.fillRect(W-20,p2.y,8,p2.h);
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fillStyle='#ffd23f'; ctx.fill();
}
step();
</script>
</body></html>
