<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Block — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🐤 Flappy Block</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div>
  <canvas id="c" width="360" height="480"></canvas>
  <div class="overlay-msg" id="msg">Click / tap / Space to flap</div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), msg=document.getElementById('msg');
let best=parseInt(localStorage.getItem('chg_flappy_best')||'0'); bestEl.textContent=best;
let bird, pipes, score, alive, started;
const GAP=140, PIPE_W=54, GRAV=0.45, FLAP=-7.5;

function reset(){
  bird={x:70,y:H/2,vy:0,r:14};
  pipes=[{x:W+40}];
  score=0; alive=true; started=false;
  msg.textContent='Click / tap / Space to flap';
  scoreEl.textContent=0;
}
function flap(){
  if(!alive){ reset(); return; }
  started=true;
  bird.vy=FLAP;
}
document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); flap(); } });
cv.addEventListener('mousedown', flap);
cv.addEventListener('touchstart', e=>{ e.preventDefault(); flap(); }, {passive:false});

function step(){
  if(started && alive){
    bird.vy+=GRAV; bird.y+=bird.vy;
    pipes.forEach(p=>p.x-=2.6);
    if(pipes[pipes.length-1].x < W-190){
      const gapY = 60 + Math.random()*(H-120-GAP);
      pipes.push({x:W+40, gapY, passed:false});
    }
    pipes.forEach(p=>{
      if(p.gapY===undefined) return;
      if(!p.passed && p.x+PIPE_W < bird.x){ p.passed=true; score++; scoreEl.textContent=score; }
    });
    pipes = pipes.filter(p=>p.x>-PIPE_W);
    pipes.forEach(p=>{
      if(p.gapY===undefined) return;
      const hitX = bird.x+bird.r>p.x && bird.x-bird.r<p.x+PIPE_W;
      const hitY = bird.y-bird.r<p.gapY || bird.y+bird.r>p.gapY+GAP;
      if(hitX && hitY) die();
    });
    if(bird.y+bird.r>H || bird.y-bird.r<0) die();
  }
  draw();
  requestAnimationFrame(step);
}
function die(){
  alive=false;
  if(score>best){ best=score; localStorage.setItem('chg_flappy_best',best); bestEl.textContent=best; }
  msg.textContent='Game over — score '+score+' — click to retry';
}
function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#38ffab';
  pipes.forEach(p=>{
    if(p.gapY===undefined) return;
    ctx.fillRect(p.x,0,PIPE_W,p.gapY);
    ctx.fillRect(p.x,p.gapY+GAP,PIPE_W,H-(p.gapY+GAP));
  });
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.max(-0.5,Math.min(0.9, bird.vy*0.05)));
  ctx.fillStyle='#ffd23f';
  ctx.fillRect(-bird.r,-bird.r,bird.r*2,bird.r*2);
  ctx.restore();
}
reset();
step();
</script>
</body></html>
