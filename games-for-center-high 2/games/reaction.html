<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Test — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #pad{width:320px;height:320px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;text-align:center;cursor:pointer;user-select:none;transition:background .1s;
    background:#2a2f57;color:#e9e8f5;}
  #pad.wait{background:#ff2e88;}
  #pad.go{background:#38ffab;color:#04211c;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">⚡ Reaction Test</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Last <b id="last">—</b> ms</div><div class="stat">Best <b id="best">—</b> ms</div><div class="stat">Rounds <b id="rounds">0</b>/5</div></div>
  <div id="pad">Tap to start</div>
  <div class="overlay-msg" id="msg"></div>
</div>

<script>
const pad=document.getElementById('pad'), lastEl=document.getElementById('last'), bestEl=document.getElementById('best'), roundsEl=document.getElementById('rounds'), msg=document.getElementById('msg');
let best = localStorage.getItem('chg_reaction_best'); bestEl.textContent = best || '—';
let state='idle', startTime, timer, rounds=0, totals=[];

pad.addEventListener('click', handleClick);
pad.addEventListener('touchstart', e=>{ e.preventDefault(); handleClick(); }, {passive:false});

function handleClick(){
  if(state==='idle'){
    startRound();
  } else if(state==='wait'){
    clearTimeout(timer);
    state='idle'; pad.className=''; pad.textContent='Too soon! Tap to try again';
    msg.textContent='';
  } else if(state==='go'){
    const rt = Date.now()-startTime;
    rounds++;
    totals.push(rt);
    lastEl.textContent = rt;
    roundsEl.textContent = rounds;
    if(!best || rt<parseInt(best)){ best=rt; localStorage.setItem('chg_reaction_best',best); bestEl.textContent=best; }
    if(rounds>=5){
      const avg = Math.round(totals.reduce((a,b)=>a+b,0)/totals.length);
      msg.textContent = 'Average over 5 rounds: '+avg+' ms — tap to play again';
      rounds=0; totals=[]; roundsEl.textContent=0;
      state='idle'; pad.className=''; pad.textContent='Tap to start';
    } else {
      state='idle'; pad.className=''; pad.textContent='Tap for round '+(rounds+1);
    }
  }
}
function startRound(){
  state='wait'; pad.className='wait'; pad.textContent='Wait for green...';
  const delay = 800 + Math.random()*2200;
  timer = setTimeout(()=>{
    state='go'; pad.className='go'; pad.textContent='TAP NOW!';
    startTime = Date.now();
  }, delay);
}
</script>
</body></html>
