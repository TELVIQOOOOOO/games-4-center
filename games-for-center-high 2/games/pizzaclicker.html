<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Clicker — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #pizza{font-size:120px;cursor:pointer;user-select:none;transition:transform .05s;filter:drop-shadow(0 10px 20px rgba(255,138,60,.4));}
  #pizza:active{transform:scale(.92);}
  .shop{display:grid;gap:10px;width:320px;margin-top:20px;}
  .shop-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
  .shop-item.afford{border-color:var(--green);}
  .shop-item .info{font-size:13px;}
  .shop-item .price{font-family:var(--font-mono);color:var(--yellow);font-size:12px;}
  .buy-btn{padding:8px 14px;border-radius:8px;border:none;background:var(--cyan);color:#04211c;font-weight:800;cursor:pointer;}
  .buy-btn:disabled{opacity:.3;cursor:default;}
  #floaters{position:relative;height:0;}
  .floater{position:absolute;color:var(--yellow);font-family:var(--font-mono);font-weight:800;pointer-events:none;
    animation:rise 0.8s ease-out forwards;}
  @keyframes rise{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-40px);}}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🍕 Pizza Clicker</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Pizzas <b id="count">0</b></div><div class="stat">Per second <b id="pps">0</b></div><div class="stat">Per click <b id="ppc">1</b></div></div>
  <div id="floaters"></div>
  <div id="pizza">🍕</div>
  <div class="shop" id="shop"></div>
  <button class="mini-btn" id="resetBtn" style="margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--ink-dim);">Reset progress</button>
</div>

<script>
const SAVE_KEY='chg_pizza_save';
const ITEMS=[
  {id:'oven',name:'Extra Oven',base:15,pps:0.1,icon:'🔥'},
  {id:'chef',name:'Hire a Chef',base:100,pps:1,icon:'👨‍🍳'},
  {id:'delivery',name:'Delivery Scooter',base:500,pps:5,icon:'🛵'},
  {id:'truck',name:'Food Truck',base:3000,pps:25,icon:'🚚'},
  {id:'franchise',name:'New Franchise',base:20000,pps:150,icon:'🏬'},
];
let state = load();
const countEl=document.getElementById('count'), ppsEl=document.getElementById('pps'), ppcEl=document.getElementById('ppc');
const pizza=document.getElementById('pizza'), shop=document.getElementById('shop'), floaters=document.getElementById('floaters');

function load(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s) return s;
  } catch(e){}
  return {count:0, owned:{}};
}
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function pps(){ return ITEMS.reduce((sum,it)=>sum + (state.owned[it.id]||0)*it.pps, 0); }
function price(it){ const n = state.owned[it.id]||0; return Math.ceil(it.base * Math.pow(1.15, n)); }

pizza.addEventListener('click', e=>{
  state.count += 1;
  spawnFloat('+1', e);
  render(); save();
});
pizza.addEventListener('touchstart', e=>{
  e.preventDefault();
  state.count += 1;
  render(); save();
}, {passive:false});

function spawnFloat(text, e){
  const f=document.createElement('div');
  f.className='floater'; f.textContent=text;
  const rect=pizza.getBoundingClientRect();
  f.style.left=(e.clientX-rect.left-10)+'px';
  f.style.top='-10px';
  pizza.parentElement.appendChild(f);
  setTimeout(()=>f.remove(),800);
}

function buy(it){
  const cost = price(it);
  if(state.count >= cost){
    state.count -= cost;
    state.owned[it.id] = (state.owned[it.id]||0)+1;
    render(); save();
  }
}
function renderShop(){
  shop.innerHTML='';
  ITEMS.forEach(it=>{
    const cost = price(it);
    const owned = state.owned[it.id]||0;
    const row=document.createElement('div');
    row.className='shop-item'+(state.count>=cost?' afford':'');
    row.innerHTML = `<div class="info">${it.icon} <b>${it.name}</b> (${owned})<br><span class="price">${cost} pizzas · +${it.pps}/s each</span></div>`;
    const btn=document.createElement('button');
    btn.className='buy-btn'; btn.textContent='Buy';
    btn.disabled = state.count < cost;
    btn.addEventListener('click', ()=>buy(it));
    row.appendChild(btn);
    shop.appendChild(row);
  });
}
function render(){
  countEl.textContent = Math.floor(state.count);
  ppsEl.textContent = pps().toFixed(1);
  ppcEl.textContent = '1';
  renderShop();
}
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset all pizza clicker progress?')){
    state = {count:0, owned:{}};
    save(); render();
  }
});
setInterval(()=>{
  state.count += pps()/10;
  render(); save();
}, 100);
render();
</script>
</body></html>
