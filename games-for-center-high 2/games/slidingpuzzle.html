<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:6px;}
  .tile{background:linear-gradient(135deg,#37f0ff,#38ffab);color:#04211c;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;}
  .tile.empty{background:#0f1226;cursor:default;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🧩 Sliding Puzzle</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Moves <b id="moves">0</b></div></div>
  <div id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="mini-btn" id="shuffle">Shuffle</button>
</div>

<script>
const boardEl=document.getElementById('board'), movesEl=document.getElementById('moves'), msg=document.getElementById('msg');
let tiles, moves;

function solvedState(){ return [...Array(15).keys()].map(n=>n+1).concat(0); }
function shuffle(){
  tiles = solvedState();
  let empty = 15;
  for(let i=0;i<300;i++){
    const options = neighbors(empty);
    const pick = options[Math.floor(Math.random()*options.length)];
    [tiles[empty],tiles[pick]] = [tiles[pick],tiles[empty]];
    empty = pick;
  }
  moves=0; movesEl.textContent=0; msg.textContent='';
  render();
}
function neighbors(i){
  const r=Math.floor(i/4), c=i%4, out=[];
  if(r>0) out.push(i-4); if(r<3) out.push(i+4);
  if(c>0) out.push(i-1); if(c<3) out.push(i+1);
  return out;
}
function tryMove(i){
  const empty = tiles.indexOf(0);
  if(neighbors(empty).includes(i)){
    [tiles[empty],tiles[i]] = [tiles[i],tiles[empty]];
    moves++; movesEl.textContent=moves;
    render();
    if(tiles.every((v,idx)=>v===solvedState()[idx])) msg.textContent='Solved in '+moves+' moves! 🎉';
  }
}
function render(){
  boardEl.innerHTML='';
  tiles.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className = 'tile' + (v===0?' empty':'');
    d.textContent = v===0 ? '' : v;
    d.addEventListener('click', ()=>tryMove(i));
    boardEl.appendChild(d);
  });
}
document.getElementById('shuffle').addEventListener('click', shuffle);
shuffle();
</script>
</body></html>
