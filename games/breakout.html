<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🧨 Breakout</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Lives <b id="lives">3</b></div></div>
  <canvas id="c" width="420" height="420"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <div class="controls-hint">Move mouse / drag finger to steer the paddle. Tap/click to launch the ball.</div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), msg=document.getElementById('msg');
let paddle, ball, bricks, score, lives, launched, running;

function initBricks(){
  bricks=[];
  const rows=5, cols=8, bw=(W-20)/cols, bh=18, colors=['#ff2e88','#ff8a3c','#ffd23f','#38ffab','#37f0ff'];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    bricks.push({x:10+c*bw, y:40+r*(bh+6), w:bw-4, h:bh, alive:true, color:colors[r]});
  }
}
function reset(){
  paddle={x:W/2-40,y:H-24,w:80,h:10};
  ball={x:W/2,y:H-40,vx:3,vy:-3,r:7};
  score=0; lives=3; launched=false; running=true;
  initBricks(); msg.textContent=''; updateHud();
}
function updateHud(){ scoreEl.textContent=score; livesEl.textContent=lives; }
function movePaddle(x){
  const rect=cv.getBoundingClientRect();
  const relX=(x-rect.left)*(W/rect.width);
  paddle.x=Math.min(W-paddle.w, Math.max(0, relX-paddle.w/2));
  if(!launched){ ball.x=paddle.x+paddle.w/2; }
}
cv.addEventListener('mousemove', e=>movePaddle(e.clientX));
cv.addEventListener('touchmove', e=>{ movePaddle(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
cv.addEventListener('mousedown', launch);
cv.addEventListener('touchstart', launch);
function launch(){ if(!launched && running){ launched=true; } else if(!running){ reset(); } }

function step(){
  if(running && launched){
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<ball.r || ball.x>W-ball.r) ball.vx*=-1;
    if(ball.y<ball.r) ball.vy*=-1;
    if(ball.y+ball.r>paddle.y && ball.y-ball.r<paddle.y+paddle.h && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
      ball.vy=-Math.abs(ball.vy);
      const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      ball.vx=hit*4;
    }
    bricks.forEach(b=>{
      if(!b.alive) return;
      if(ball.x>b.x && ball.x<b.x+b.w && ball.y-ball.r<b.y+b.h && ball.y+ball.r>b.y){
        b.alive=false; ball.vy*=-1; score+=10; updateHud();
      }
    });
    if(ball.y>H+20){
      lives--; updateHud();
      if(lives<=0){ running=false; msg.textContent='Game over — tap to restart'; }
      else { launched=false; ball={x:paddle.x+paddle.w/2,y:H-40,vx:3,vy:-3,r:7}; }
    }
    if(bricks.every(b=>!b.alive)){ running=false; msg.textContent='You cleared it! Tap to play again'; }
  }
  draw();
  requestAnimationFrame(step);
}
function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{ if(b.alive){ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h); } });
  ctx.fillStyle='#e9e8f5'; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fillStyle='#37f0ff'; ctx.fill();
}
reset();
step();
</script>
</body></html>
