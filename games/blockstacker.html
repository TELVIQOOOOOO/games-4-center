<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Stacker — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🧱 Block Stacker</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Lines <b id="lines">0</b></div></div>
  <canvas id="c" width="240" height="440"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <div class="controls-hint">← → move · ↓ soft drop · ↑ rotate · Space hard drop. On touch: swipe or tap buttons below.</div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;">
    <button class="mini-btn" id="bL">←</button>
    <button class="mini-btn" id="bR">→</button>
    <button class="mini-btn" id="bRot">⟳</button>
    <button class="mini-btn" id="bDown">↓</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const COLS=8, ROWS=16, SZ=cv.width/COLS;
const scoreEl=document.getElementById('score'), linesEl=document.getElementById('lines'), msg=document.getElementById('msg');
const SHAPES = {
  I:[[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]],
  S:[[0,1,1],[1,1,0]], Z:[[1,1,0],[0,1,1]], L:[[1,0],[1,0],[1,1]], J:[[0,1],[0,1],[1,1]]
};
const COLORS = {I:'#37f0ff',O:'#ffd23f',T:'#a06bff',S:'#38ffab',Z:'#ff2e88',L:'#ff8a3c',J:'#4d8bff'};
let board, cur, score, lines, alive, dropTimer;

function newPiece(){
  const keys = Object.keys(SHAPES);
  const k = keys[Math.floor(Math.random()*keys.length)];
  return {shape: SHAPES[k].map(r=>r.slice()), color: COLORS[k], x: Math.floor(COLS/2)-1, y: 0};
}
function reset(){
  board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  cur = newPiece(); score=0; lines=0; alive=true; msg.textContent='';
  scoreEl.textContent=0; linesEl.textContent=0;
  clearInterval(dropTimer); dropTimer = setInterval(()=>drop(), 500);
}
function collide(shape,x,y){
  for(let r=0;r<shape.length;r++) for(let c=0;c<shape[r].length;c++){
    if(!shape[r][c]) continue;
    const nx=x+c, ny=y+r;
    if(nx<0||nx>=COLS||ny>=ROWS) return true;
    if(ny>=0 && board[ny][nx]) return true;
  }
  return false;
}
function merge(){
  cur.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v){ const ny=cur.y+r, nx=cur.x+c; if(ny>=0) board[ny][nx]=cur.color; } }));
}
function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(cell=>cell)){
      board.splice(r,1); board.unshift(Array(COLS).fill(null)); cleared++; r++;
    }
  }
  if(cleared){ lines+=cleared; score += [0,100,300,500,800][cleared]; scoreEl.textContent=score; linesEl.textContent=lines; }
}
function drop(){
  if(!alive) return;
  if(!collide(cur.shape,cur.x,cur.y+1)){ cur.y++; }
  else {
    merge(); clearLines();
    cur = newPiece();
    if(collide(cur.shape,cur.x,cur.y)){ alive=false; clearInterval(dropTimer); msg.textContent='Game over — press R or tap board to restart'; }
  }
  draw();
}
function rotate(){
  const s = cur.shape;
  const rotated = s[0].map((_,i)=>s.map(row=>row[i]).reverse());
  if(!collide(rotated,cur.x,cur.y)){ cur.shape=rotated; draw(); }
}
function move(dx){ if(!collide(cur.shape,cur.x+dx,cur.y)){ cur.x+=dx; draw(); } }
function hardDrop(){ while(!collide(cur.shape,cur.x,cur.y+1)) cur.y++; drop(); }

document.addEventListener('keydown', e=>{
  if(!alive){ if(e.key.toLowerCase()==='r') reset(); return; }
  const k=e.key.toLowerCase();
  if(k==='arrowleft') move(-1);
  else if(k==='arrowright') move(1);
  else if(k==='arrowdown') drop();
  else if(k==='arrowup') rotate();
  else if(e.code==='Space'){ e.preventDefault(); hardDrop(); }
});
document.getElementById('bL').addEventListener('click', ()=>move(-1));
document.getElementById('bR').addEventListener('click', ()=>move(1));
document.getElementById('bRot').addEventListener('click', rotate);
document.getElementById('bDown').addEventListener('click', drop);
cv.addEventListener('click', ()=>{ if(!alive) reset(); });

function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]){ ctx.fillStyle=board[r][c]; ctx.fillRect(c*SZ+1,r*SZ+1,SZ-2,SZ-2); }
  }
  ctx.fillStyle=cur.color;
  cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v) ctx.fillRect((cur.x+c)*SZ+1,(cur.y+r)*SZ+1,SZ-2,SZ-2);
  }));
}
reset();
draw();
</script>
</body></html>
