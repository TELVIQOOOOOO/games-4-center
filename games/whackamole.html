<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{display:grid;grid-template-columns:repeat(3,100px);gap:14px;}
  .hole{width:100px;height:100px;border-radius:50%;background:#0f1226;border:3px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;user-select:none;}
  .hole.up{background:#1c2040;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🔨 Whack-a-Mole</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Time <b id="time">30</b>s</div><div class="stat">Best <b id="best">0</b></div></div>
  <div id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="mini-btn" id="startBtn">Start</button>
</div>

<script>
const boardEl = document.getElementById('board');
const scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), bestEl=document.getElementById('best'), msg=document.getElementById('msg');
let best = parseInt(localStorage.getItem('chg_mole_best')||'0'); bestEl.textContent=best;
let holes=[], score=0, timeLeft=30, running=false, spawnTimer, tickTimer, activeIdx=-1;

for(let i=0;i<9;i++){
  const d=document.createElement('div');
  d.className='hole';
  d.addEventListener('click', ()=>whack(i));
  boardEl.appendChild(d);
  holes.push(d);
}
function whack(i){
  if(!running) return;
  if(i===activeIdx){
    score++; scoreEl.textContent=score;
    holes[i].textContent=''; holes[i].className='hole';
    activeIdx=-1;
  }
}
function spawn(){
  if(activeIdx>=0){ holes[activeIdx].textContent=''; holes[activeIdx].className='hole'; }
  activeIdx = Math.floor(Math.random()*9);
  holes[activeIdx].textContent='🐹';
  holes[activeIdx].className='hole up';
  const delay = Math.max(450, 1000 - score*15);
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawn, delay);
}
function start(){
  score=0; timeLeft=30; running=true; msg.textContent='';
  scoreEl.textContent=0; timeEl.textContent=30;
  document.getElementById('startBtn').textContent='Restart';
  spawn();
  clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    timeLeft--; timeEl.textContent=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
}
function endGame(){
  running=false;
  clearTimeout(spawnTimer); clearInterval(tickTimer);
  holes.forEach(h=>{ h.textContent=''; h.className='hole'; });
  if(score>best){ best=score; localStorage.setItem('chg_mole_best',best); bestEl.textContent=best; }
  msg.textContent = 'Time up! Score: ' + score;
}
document.getElementById('startBtn').addEventListener('click', start);
</script>
</body></html>
