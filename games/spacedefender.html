<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Defender — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">👾 Space Defender</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Lives <b id="lives">3</b></div></div>
  <canvas id="c" width="420" height="480"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <div class="controls-hint">Arrow keys / A-D to move, Space to shoot. Tap left/right half to move, tap top to shoot on mobile.</div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), msg=document.getElementById('msg');
let ship, bullets, enemyBullets, enemies, score, lives, running, dir=0, edir=1, estep=0;

function initEnemies(){
  enemies=[];
  for(let r=0;r<4;r++) for(let c=0;c<7;c++){
    enemies.push({x:30+c*48,y:40+r*40,alive:true});
  }
}
function reset(){
  ship={x:W/2-16,y:H-40,w:32,h:16};
  bullets=[]; enemyBullets=[]; score=0; lives=3; running=true; edir=1;
  initEnemies(); msg.textContent=''; updateHud();
}
function updateHud(){ scoreEl.textContent=score; livesEl.textContent=lives; }
let keys={};
document.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==='Space'){ e.preventDefault(); shoot(); }
  if(!running && e.key) reset();
});
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
function shoot(){ if(running) bullets.push({x:ship.x+ship.w/2-2,y:ship.y}); }
cv.addEventListener('touchstart', e=>{
  const rect=cv.getBoundingClientRect();
  const x=e.touches[0].clientX-rect.left, y=e.touches[0].clientY-rect.top;
  if(!running){ reset(); return; }
  if(y<80) shoot();
  else dir = x<W/2 ? -1 : 1;
}, {passive:false});
cv.addEventListener('touchend', ()=>dir=0);

function step(){
  if(running){
    if(keys['arrowleft']||keys['a']) dir=-1;
    else if(keys['arrowright']||keys['d']) dir=1;
    else if(!('ontouchstart' in window)) dir=0;
    ship.x=Math.max(0,Math.min(W-ship.w, ship.x+dir*5));

    bullets.forEach(b=>b.y-=7); bullets=bullets.filter(b=>b.y>-10);
    enemyBullets.forEach(b=>b.y+=4); enemyBullets=enemyBullets.filter(b=>b.y<H+10);

    estep++;
    if(estep%40===0){
      let hitEdge=false;
      enemies.forEach(e=>{ if(e.alive){ e.x+=edir*14; if(e.x<10||e.x>W-30) hitEdge=true; } });
      if(hitEdge){ edir*=-1; enemies.forEach(e=>e.y+=16); }
      const alive=enemies.filter(e=>e.alive);
      if(alive.length && Math.random()<0.6){
        const shooter=alive[Math.floor(Math.random()*alive.length)];
        enemyBullets.push({x:shooter.x+10,y:shooter.y+10});
      }
    }
    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(e.alive && b.x>e.x && b.x<e.x+28 && b.y>e.y && b.y<e.y+20){
          e.alive=false; b.y=-100; score+=10; updateHud();
        }
      });
    });
    enemyBullets.forEach(b=>{
      if(b.x>ship.x && b.x<ship.x+ship.w && b.y>ship.y && b.y<ship.y+ship.h){
        b.y=H+100; lives--; updateHud();
        if(lives<=0) endGame(false);
      }
    });
    enemies.forEach(e=>{ if(e.alive && e.y>ship.y-10) endGame(false); });
    if(enemies.every(e=>!e.alive)) endGame(true);
  }
  draw();
  requestAnimationFrame(step);
}
function endGame(win){
  running=false;
  msg.textContent = win ? 'Wave cleared! Press any key / tap to go again' : 'Game over — press any key / tap to retry';
}
cv.addEventListener('mousedown', ()=>{ if(!running) reset(); });
function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#37f0ff'; ctx.fillRect(ship.x,ship.y,ship.w,ship.h);
  ctx.fillStyle='#ffd23f'; bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
  ctx.fillStyle='#ff2e88'; enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
  ctx.fillStyle='#38ffab';
  enemies.forEach(e=>{ if(e.alive) ctx.fillRect(e.x,e.y,26,18); });
}
reset();
step();
</script>
</body></html>
