<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:8px;
    background:#0f1226;padding:8px;border-radius:10px;border:2px solid var(--line);}
  .cell{display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;font-size:22px;
    background:#1c2040;color:#e9e8f5;transition:background .1s;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🔢 2048</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div>
  <div id="board"></div>
  <div class="overlay-msg" id="msg"></div>
  <button class="mini-btn" id="restart">Restart</button>
  <div class="controls-hint">Arrow keys or WASD. Swipe on touch screens. Combine matching tiles to reach 2048.</div>
</div>

<script>
const COLORS = {2:'#1c2040',4:'#242a52',8:'#ff8a3c',16:'#ff6f3c',32:'#ff2e88',64:'#e0116f',
  128:'#ffd23f',256:'#ffc93f',512:'#38ffab',1024:'#37f0ff',2048:'#a06bff'};
let grid, score, best, boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), msg = document.getElementById('msg');
best = parseInt(localStorage.getItem('chg_2048_best')||'0'); bestEl.textContent = best;

function reset(){
  grid = Array.from({length:4},()=>Array(4).fill(0));
  score = 0; msg.textContent=''; scoreEl.textContent = 0;
  addTile(); addTile(); render();
}
function addTile(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(grid[r][c]===0) empty.push([r,c]);
  if(!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random()<0.9 ? 2 : 4;
}
function render(){
  boardEl.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v = grid[r][c];
    const d = document.createElement('div');
    d.className='cell';
    d.style.background = v ? (COLORS[v]||'#a06bff') : '#151833';
    d.textContent = v||'';
    boardEl.appendChild(d);
  }
  scoreEl.textContent = score;
  if(score>best){ best=score; localStorage.setItem('chg_2048_best',best); bestEl.textContent=best; }
}
function slideRow(row){
  let arr = row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
  }
  while(arr.length<4) arr.push(0);
  return arr;
}
function rotate(g){
  const n = Array.from({length:4},()=>Array(4).fill(0));
  for(let r=0;r<4;r++)for(let c=0;c<4;c++) n[c][3-r]=g[r][c];
  return n;
}
function move(dir){
  let g = grid.map(r=>r.slice());
  let rot=0;
  if(dir==='up') rot=3; else if(dir==='right') rot=2; else if(dir==='down') rot=1;
  for(let i=0;i<rot;i++) g = rotate(g);
  g = g.map(slideRow);
  for(let i=0;i<(4-rot)%4;i++) g = rotate(g);
  const changed = JSON.stringify(g)!==JSON.stringify(grid);
  grid = g;
  if(changed){ addTile(); render(); checkOver(); }
}
function checkOver(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(grid[r][c]===0) return;
    if(c<3 && grid[r][c]===grid[r][c+1]) return;
    if(r<3 && grid[r][c]===grid[r+1][c]) return;
  }
  msg.textContent = 'No more moves — press Restart';
}
document.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w') move('up');
  else if(k==='arrowdown'||k==='s') move('down');
  else if(k==='arrowleft'||k==='a') move('left');
  else if(k==='arrowright'||k==='d') move('right');
});
let tsx=0,tsy=0;
document.addEventListener('touchstart', e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; });
document.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
});
document.getElementById('restart').addEventListener('click', reset);
reset();
</script>
</body></html>
