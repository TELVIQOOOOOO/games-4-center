<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{display:grid;grid-template-columns:repeat(7,50px);grid-template-rows:repeat(6,50px);gap:6px;
    background:#12163a;padding:8px;border-radius:10px;}
  .cell{width:50px;height:50px;border-radius:50%;background:#05060d;cursor:pointer;}
  .cell.r{background:#ff2e88;} .cell.y{background:#ffd23f;}
  #cols{display:grid;grid-template-columns:repeat(7,50px);gap:6px;margin-bottom:4px;}
  .colbtn{width:50px;height:24px;cursor:pointer;color:var(--ink-dim);text-align:center;font-family:var(--font-mono);}
  .colbtn:hover{color:var(--cyan);}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🔴 Connect Four</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Red wins <b id="rw">0</b></div><div class="stat">Yellow wins <b id="yw">0</b></div></div>
  <div id="cols"></div>
  <div id="board"></div>
  <div class="overlay-msg" id="msg">Red's turn</div>
  <button class="mini-btn" id="restart">New round</button>
  <div class="controls-hint">2 players, same device — click a column arrow to drop a piece.</div>
</div>

<script>
const ROWS=6, COLS=7;
const boardEl=document.getElementById('board'), colsEl=document.getElementById('cols'), msg=document.getElementById('msg');
const rwEl=document.getElementById('rw'), ywEl=document.getElementById('yw');
let grid, turn, over, rw=0, yw=0;

function reset(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  turn='r'; over=false; msg.textContent="Red's turn";
  render();
}
function drop(c){
  if(over) return;
  for(let r=ROWS-1;r>=0;r--){
    if(!grid[r][c]){
      grid[r][c]=turn;
      if(checkWin(r,c)){
        over=true; msg.textContent=(turn==='r'?'Red':'Yellow')+' wins!';
        if(turn==='r'){ rw++; rwEl.textContent=rw; } else { yw++; ywEl.textContent=yw; }
      } else if(grid.every(row=>row.every(cell=>cell))){
        over=true; msg.textContent="It's a draw!";
      } else {
        turn = turn==='r'?'y':'r';
        msg.textContent = (turn==='r'?"Red":"Yellow")+"'s turn";
      }
      render();
      return;
    }
  }
}
function checkWin(r,c){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  return dirs.some(([dr,dc])=>{
    let count=1;
    for(const s of [1,-1]){
      let rr=r+dr*s, cc=c+dc*s;
      while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===turn){ count++; rr+=dr*s; cc+=dc*s; }
    }
    return count>=4;
  });
}
function render(){
  colsEl.innerHTML='';
  for(let c=0;c<COLS;c++){
    const b=document.createElement('div'); b.className='colbtn'; b.textContent='▼';
    b.addEventListener('click', ()=>drop(c));
    colsEl.appendChild(b);
  }
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='cell'+(grid[r][c]?(' '+grid[r][c]):'');
    d.addEventListener('click', ()=>drop(c));
    boardEl.appendChild(d);
  }
}
document.getElementById('restart').addEventListener('click', reset);
reset();
</script>
</body></html>
