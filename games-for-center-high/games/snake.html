<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">🐍 Snake</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">Score <b id="score">0</b></div><div class="stat">Best <b id="best">0</b></div></div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="overlay-msg" id="msg"></div>
  <div class="controls-hint">Arrow keys or WASD to steer. Swipe on touch screens.</div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GRID = 20, CELLS = cv.width / GRID;
let snake, dir, nextDir, food, score, best, alive, loopId;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), msg = document.getElementById('msg');
best = parseInt(localStorage.getItem('chg_snake_best') || '0');
bestEl.textContent = best;

function reset(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; alive = true; msg.textContent = '';
  placeFood();
  scoreEl.textContent = score;
  clearInterval(loopId);
  loopId = setInterval(tick, 100);
}
function placeFood(){
  do { food = {x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS)}; }
  while(snake.some(s=>s.x===food.x && s.y===food.y));
}
function tick(){
  if(!alive) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if(head.x<0||head.y<0||head.x>=CELLS||head.y>=CELLS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    alive = false;
    if(score > best){ best = score; localStorage.setItem('chg_snake_best', best); bestEl.textContent = best; }
    msg.textContent = 'Game over — press R or tap to restart';
    draw();
    return;
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){ score++; scoreEl.textContent = score; placeFood(); }
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#ff2e88';
  ctx.fillRect(food.x*GRID+2, food.y*GRID+2, GRID-4, GRID-4);
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#37f0ff' : '#38ffab';
    ctx.fillRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2);
  });
}
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if((k==='arrowup'||k==='w') && dir.y===0) nextDir={x:0,y:-1};
  else if((k==='arrowdown'||k==='s') && dir.y===0) nextDir={x:0,y:1};
  else if((k==='arrowleft'||k==='a') && dir.x===0) nextDir={x:-1,y:0};
  else if((k==='arrowright'||k==='d') && dir.x===0) nextDir={x:1,y:0};
  else if(k==='r' && !alive) reset();
});
let tsx=0, tsy=0;
cv.addEventListener('touchstart', e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; });
cv.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx>20 && dir.x===0) nextDir={x:1,y:0};
    else if(dx<-20 && dir.x===0) nextDir={x:-1,y:0};
  } else {
    if(dy>20 && dir.y===0) nextDir={x:0,y:1};
    else if(dy<-20 && dir.y===0) nextDir={x:0,y:-1};
  }
});
cv.addEventListener('click', ()=>{ if(!alive) reset(); });
reset();
</script>
</body></html>
