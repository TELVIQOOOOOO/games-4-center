<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors — GAMES FOR CENTER HIGH</title>
<link rel="stylesheet" href="../style.css">
<style>
  .rps-row{display:flex;gap:16px;margin-top:10px;}
  .rps-btn{font-size:40px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:84px;height:84px;cursor:pointer;}
  .rps-btn:hover{border-color:var(--cyan);}
  .arena{display:flex;gap:40px;align-items:center;justify-content:center;margin:24px 0;font-size:60px;}
</style>
</head><body>
<script src="../access.js"></script>
<script>if(!chgIsUnlocked()){location.href="../index.html";}</script>

<div class="game-top"><a class="back" href="../index.html">← Arcade</a><div class="title">✊ Rock Paper Scissors</div><div style="width:70px;"></div></div>

<div class="game-stage">
  <div class="hud"><div class="stat">You <b id="you">0</b></div><div class="stat">CPU <b id="cpu">0</b></div><div class="stat">Ties <b id="ties">0</b></div></div>
  <div class="arena">
    <div id="youIcon">❔</div>
    <div style="font-size:20px;color:var(--ink-dim);">vs</div>
    <div id="cpuIcon">❔</div>
  </div>
  <div class="overlay-msg" id="msg">Pick one</div>
  <div class="rps-row">
    <button class="rps-btn" data-c="rock">✊</button>
    <button class="rps-btn" data-c="paper">✋</button>
    <button class="rps-btn" data-c="scissors">✌️</button>
  </div>
</div>

<script>
const ICONS={rock:'✊',paper:'✋',scissors:'✌️'};
const youEl=document.getElementById('you'), cpuEl=document.getElementById('cpu'), tiesEl=document.getElementById('ties'), msg=document.getElementById('msg');
let you=0,cpu=0,ties=0;
document.querySelectorAll('.rps-btn').forEach(b=>{
  b.addEventListener('click', ()=>play(b.dataset.c));
});
function play(choice){
  const options=['rock','paper','scissors'];
  const cpuChoice = options[Math.floor(Math.random()*3)];
  document.getElementById('youIcon').textContent = ICONS[choice];
  document.getElementById('cpuIcon').textContent = ICONS[cpuChoice];
  if(choice===cpuChoice){ ties++; tiesEl.textContent=ties; msg.textContent="Tie — it's a "+choice+" standoff"; return; }
  const beats = {rock:'scissors',paper:'rock',scissors:'paper'};
  if(beats[choice]===cpuChoice){ you++; youEl.textContent=you; msg.textContent = choice+' beats '+cpuChoice+' — you win!'; }
  else { cpu++; cpuEl.textContent=cpu; msg.textContent = cpuChoice+' beats '+choice+' — CPU wins'; }
}
</script>
</body></html>
